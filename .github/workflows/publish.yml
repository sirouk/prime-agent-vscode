name: Publish extension

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.repository == 'sirouk/prime-agent-vscode'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify build (mirror of the release gate)
        run: |
          npx tsc --noEmit
          node esbuild.config.mjs
          node test/webview.test.mjs
          node test/export-md.test.mjs
          node test/activate.test.mjs

      - name: Package the vsix
        run: npm run package

      - name: Publish to the VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx vsce publish --packagePath "$(ls -t prime-agent-vscode-*.vsix | head -1)"
