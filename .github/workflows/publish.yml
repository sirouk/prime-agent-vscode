name: Publish extension

on:
  push:
    branches: [master]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Locked @vscode/vsce dependencies require Node 22 or newer.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify build
        run: |
          npm run typecheck
          npm test

  publish:
    needs: verify
    if: github.event_name == 'release' && github.repository == 'sirouk/prime-agent-vscode'
    runs-on: ubuntu-latest
    # VSCE_PAT lives in the "CI" environment. Declaring it here grants this
    # release-only job access without exposing deployment secrets to PR checks.
    environment: CI
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check the tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match package.json version $pkg" >&2
            exit 1
          fi
          echo "Publishing version $pkg"

      - name: Package the vsix
        run: |
          # vsce globs with dot:true and ignores .gitignore, so anything untracked
          # that happens to sit in the tree ships. A denylist of one filename
          # could not catch graphify-out; assert the whole file set instead.
          unexpected="$(npx vsce ls --no-dependencies | grep -vE '^(package\.json|README\.md|LICENSE|CHANGELOG\.md|dist/extension\.js|media/(main\.js|main\.css|panels\.css|icon\.png|icon\.svg))$' || true)"
          if [ -n "$unexpected" ]; then
            echo "refusing to package: unexpected files would ship inside the vsix:" >&2
            echo "$unexpected" >&2
            exit 1
          fi
          npm run package

      - name: Publish to the VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "VSCE_PAT resolved to empty — cannot publish." >&2
            echo "It must be a SECRET (not a variable) named VSCE_PAT, stored either in the" >&2
            echo "'CI' environment (Settings > Environments > CI > Add environment secret)" >&2
            echo "or at repo level (Settings > Secrets and variables > Actions)." >&2
            echo "Then re-run this workflow." >&2
            exit 1
          fi
          # Publish the vsix for this version by name; `ls -t` would happily pick
          # up some other bundle if packaging ever leaves more than one behind.
          vsix="prime-agent-vscode-$(node -p "require('./package.json').version").vsix"
          [ -f "$vsix" ] || { echo "npm run package did not produce $vsix" >&2; exit 1; }
          npx vsce publish --packagePath "$vsix"
