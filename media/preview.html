<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<style>body { margin: 0; background: #0f0f0f; font-family: -apple-system, "SF Pro Text", sans-serif; font-size: 13px; color: #f5f7f8; } body { --vscode-sideBar-background: #0f0f0f; --vscode-foreground: #f5f7f8; --vscode-descriptionForeground: #8a8a8a; --vscode-font-family: -apple-system, "SF Pro Text", sans-serif; --vscode-font-size: 13px; --vscode-editor-font-family: "SF Mono", Menlo, monospace; }</style>
	<link rel="stylesheet" href="main.css" />
	<style>
		body { height: 100vh; overflow: hidden; }
		body { class: "vscode-dark"; }
	</style>
</head>
<body class="vscode-dark">
	<div id="app"></div>
	<script>
		const postedMessages = [];
		window.acquireVsCodeApi = () => ({
			postMessage: (m) => postedMessages.push(m),
			getState: () => undefined,
			setState: () => {},
		});
	</script>
	<script src="main.js"></script>
	<script>
		const host = (data) => window.dispatchEvent(new MessageEvent("message", { data }));
		const baseStatus = {
			connected: true, streaming: false, compacting: false, retrying: false, restoring: false,
			modelLabel: "chutes/moonshotai/Kimi-K3-TEE", thinkingLevel: "max",
			sessionName: "vscode-extension", sessionId: "019fd749-3f2a",
			statsText: "", usageTotal: 183400, costUsd: 0.0612,
			contextTokens: 142400, contextWindow: 262144, contextPercent: 54,
		};
		const mode = new URLSearchParams(location.search).get("mode") || "chat";

		if (mode === "welcome") {
			host({ type: "status", status: baseStatus });
		} else if (mode === "modelmenu") {
			host({ type: "snapshot", messages: [], state: null, status: baseStatus, steerDefault: "steer" });
			host({ type: "models", models: [
				{ provider: "chutes", id: "moonshotai/Kimi-K3-TEE", contextWindow: 262144, reasoning: true },
				{ provider: "chutes", id: "deepseek-ai/DeepSeek-V3.2", contextWindow: 131072, reasoning: false },
				{ provider: "anthropic", id: "claude-sonnet-4-5", contextWindow: 200000, reasoning: true },
				{ provider: "openai", id: "gpt-5.2-codex", contextWindow: 400000, reasoning: true },
				{ provider: "chutes", id: "zai-org/GLM-4.7", contextWindow: 131072, reasoning: true },
			] });
			host({ type: "favorites", favorites: [
				{ provider: "chutes", modelId: "moonshotai/Kimi-K3-TEE" },
				{ provider: "anthropic", modelId: "claude-sonnet-4-5" },
			] });
			host({ type: "snapshot", messages: [], state: { model: { provider: "chutes", id: "moonshotai/Kimi-K3-TEE" }, thinkingLevel: "max" }, status: baseStatus, steerDefault: "steer" });
			setTimeout(() => document.querySelector(".rail-pill.model").dispatchEvent(new MouseEvent("click", { bubbles: true })), 150);
		} else if (mode === "history") {
			host({ type: "snapshot", messages: [], state: null, status: baseStatus, steerDefault: "steer" });
			host({ type: "showHistory" });
			const now = Date.now();
			host({ type: "history", sessions: [
				{ path: "/a/1.jsonl", cwd: "/home/dev/prime-agent-vscode", timestamp: new Date(now - 3600e3).toISOString(), name: "vscode-extension", inWorkspace: true },
				{ path: "/a/2.jsonl", cwd: "/home/dev/prime-agent-vscode", timestamp: new Date(now - 3*3600e3).toISOString(), name: "vscode-session", firstPrompt: "Add a VS Code extension that talks to the RPC mode", inWorkspace: true },
				{ path: "/a/3.jsonl", cwd: "/home/dev/airship", timestamp: new Date(now - 26*3600e3).toISOString(), name: "airship-deploys", inWorkspace: false },
				{ path: "/a/4.jsonl", cwd: "/home/oss/prime-agent", timestamp: new Date(now - 50*3600e3).toISOString(), firstPrompt: "Study the prime-agent system", inWorkspace: false },
			] });
		} else if (mode === "attachmenu") {
			host({ type: "snapshot", messages: [], state: null, status: baseStatus, steerDefault: "steer" });
			host({ type: "models", models: [
				{ provider: "chutes", id: "moonshotai/Kimi-K3-TEE", contextWindow: 262144, reasoning: true, input: ["text"] },
				{ provider: "openai", id: "gpt-5.2-codex", contextWindow: 400000, reasoning: true, input: ["text", "image"] },
			] });
			// Current model is text-only → the Image… item must render disabled.
			host({ type: "status", status: { ...baseStatus, modelProvider: "chutes", modelId: "moonshotai/Kimi-K3-TEE" } });
			setTimeout(() => document.querySelector('.composer-rail .icon-btn[title^="Attach"]').dispatchEvent(new MouseEvent("click", { bubbles: true })), 150);
		} else if (mode === "modelmenu2") {
			host({ type: "snapshot", messages: [], state: null, status: baseStatus, steerDefault: "steer" });
			host({ type: "models", models: [
				{ provider: "chutes", id: "moonshotai/Kimi-K3-TEE", contextWindow: 262144, reasoning: true, input: ["text", "image"] },
				{ provider: "chutes", id: "deepseek-ai/DeepSeek-V3.2", contextWindow: 131072, reasoning: false, input: ["text"] },
				{ provider: "anthropic", id: "claude-sonnet-4-5", contextWindow: 200000, reasoning: true, input: ["text", "image"] },
				{ provider: "openai", id: "gpt-5.2-codex", contextWindow: 400000, reasoning: true, input: ["text", "image"] },
				{ provider: "chutes", id: "zai-org/GLM-4.7", contextWindow: 131072, reasoning: true, input: ["text"] },
			] });
			host({ type: "favorites", favorites: [
				{ provider: "chutes", modelId: "moonshotai/Kimi-K3-TEE" },
				{ provider: "anthropic", modelId: "claude-sonnet-4-5" },
			] });
			// Kimi K3 TEE's real thinkingLevelMap maps every level to null except
			// "max" — the host derives this list, and the brain menu must show it
			// verbatim rather than the old invented six.
			host({ type: "snapshot", messages: [], state: { model: { provider: "chutes", id: "moonshotai/Kimi-K3-TEE" }, thinkingLevel: "max" }, status: { ...baseStatus, modelProvider: "chutes", modelId: "moonshotai/Kimi-K3-TEE", availableThinkingLevels: ["max"] }, steerDefault: "steer" });
			setTimeout(() => {
				document.querySelector(".rail-pill.model").dispatchEvent(new MouseEvent("click", { bubbles: true }));
				// The list is capped at 340px; scroll so the Thinking level section is in view.
				setTimeout(() => {
					const list = document.querySelector(".dropdown-list");
					if (list) list.scrollTop = list.scrollHeight;
				}, 80);
			}, 150);
		} else if (mode === "history2") {
			host({ type: "snapshot", messages: [], state: null, status: baseStatus, steerDefault: "steer" });
			host({ type: "showHistory" });
			const now2 = Date.now();
			host({ type: "history", sessions: [
				{ id: "019fd749-3f2a", path: "/a/1.jsonl", cwd: "/home/dev/prime-agent-vscode", timestamp: new Date(now2 - 3600e3).toISOString(), name: "vscode-extension", inWorkspace: true },
				{ id: "019fd111-aaaa", path: "/a/2.jsonl", cwd: "/home/dev/prime-agent-vscode", timestamp: new Date(now2 - 3*3600e3).toISOString(), name: "vscode-session", firstPrompt: "Add a VS Code extension that talks to the RPC mode", inWorkspace: true },
				{ id: "019fd222-bbbb", path: "/a/3.jsonl", cwd: "/home/dev/airship", timestamp: new Date(now2 - 26*3600e3).toISOString(), name: "airship-deploys", inWorkspace: false },
				{ id: "019fd333-cccc", path: "/a/4.jsonl", cwd: "/home/oss/prime-agent", timestamp: new Date(now2 - 50*3600e3).toISOString(), firstPrompt: "Study the prime-agent system", inWorkspace: false },
			] });
			// Pre-arm one item so the screenshot shows the inline Delete/cancel confirm state.
			// Resolve the delete action by title, never by index: the row's action set
			// grows (stop, archive) and a positional pick silently arms the wrong one.
			setTimeout(() => {
				const row = document.querySelector(".history-item:not(.current)");
				const del = [...(row?.querySelectorAll(".history-actions .history-action") ?? [])]
					.find((b) => (b.title ?? "").startsWith("Delete"));
				del?.dispatchEvent(new MouseEvent("click", { bubbles: true }));
			}, 150);
		} else if (mode === "markdownnote") {
			host({
				type: "snapshot",
				messages: [
					{ role: "user", content: "Please review @src/foo/bar.ts and tighten the retry backoff in it." },
					{
						role: "assistant", model: "Kimi-K3-TEE", stopReason: "stop",
						content: [
							{ type: "text", text: "Opened `src/foo/bar.ts` — the backoff is linear right now. I'll switch it to exponential with jitter and cap it at 30s." },
						],
						usage: { input: 1800, output: 240, totalTokens: 2040, cost: { input: 0.0008, output: 0.0002, total: 0.001 } },
					},
				],
				state: { model: { provider: "chutes", id: "moonshotai/Kimi-K3-TEE" }, thinkingLevel: "max" },
				status: baseStatus,
			});
		} else if (mode === "retry") {
			host({
				type: "snapshot",
				messages: [
					{ role: "user", content: "Run the smoke suite and report failures." },
					{
						role: "assistant", model: "Kimi-K3-TEE", stopReason: "stop",
						content: [
							{ type: "text", text: "Starting the suite now; I'll stream results as they land." },
						],
						usage: { input: 1400, output: 160, totalTokens: 1560, cost: { input: 0.0008, output: 0.0002, total: 0.001 } },
					},
				],
				state: { model: { provider: "chutes", id: "moonshotai/Kimi-K3-TEE" }, thinkingLevel: "max" },
				status: { ...baseStatus, streaming: true, retrying: true },
			});
			host({ type: "event", event: { type: "agent_start" } });
			host({ type: "event", event: { type: "auto_retry_start", attempt: 2, maxAttempts: 5, delayMs: 4000, errorMessage: "timeout" } });
		} else {
			host({
				type: "snapshot",
				messages: [
					{ role: "user", content: "Add a VS Code extension that talks to the RPC mode. Use @packages/coding-agent/docs/rpc.md for the protocol. Reply concisely." },
					{
						role: "assistant", model: "Kimi-K3-TEE", stopReason: "toolUse",
						content: [
							{ type: "thinking", thinking: "Let me look at the RPC docs first, then check how the daemon frames JSONL responses..." },
							{ type: "text", text: "I'll study the RPC protocol and build the extension around it.\n\nThe protocol is newline-delimited JSON over stdio:\n\n- **commands** on stdin, `id`-correlated\n- **events** streamed on stdout\n\nLet me verify the framing edge cases first." },
							{ type: "toolCall", id: "tc1", name: "ipython", arguments: { code: "import json\n\nwith open('packages/coding-agent/src/modes/rpc/rpc-types.ts') as f:\n    src = f.read()\nprint(len(src.splitlines()), 'lines')" } },
						],
						usage: { input: 9800, output: 430, totalTokens: 10230, cost: { input: 0.0035, output: 0.0005, total: 0.004 } },
					},
					{ role: "toolResult", toolCallId: "tc1", toolName: "ipython", content: [{ type: "text", text: "372 lines" }] },
					{
						role: "assistant", model: "Kimi-K3-TEE", stopReason: "toolUse",
						content: [
							{ type: "text", text: "Framing splits on `\\n` only — the client must **not** use `readline`. Now the client:" },
							{ type: "toolCall", id: "tc2", name: "edit", arguments: { path: "src/rpc-client.ts" } },
						],
						usage: { input: 12300, output: 600, totalTokens: 12900, cost: { input: 0.0052, output: 0.0008, total: 0.006 } },
					},
					{ role: "toolResult", toolCallId: "tc2", toolName: "edit", content: [{ type: "text", text: "File created: src/rpc-client.ts (221 lines)" }] },
				],
				state: { model: { provider: "chutes", id: "moonshotai/Kimi-K3-TEE" }, thinkingLevel: "max" },
				status: { ...baseStatus, streaming: true },
			});
			// Simulate an in-flight run: partial assistant text + a running tool
			host({ type: "event", event: { type: "agent_start" } });
			host({ type: "event", event: { type: "message_start", message: { role: "assistant", content: [] } } });
			host({ type: "event", event: { type: "message_update", message: { role: "assistant", content: [{ type: "text", text: "Running the smoke test with a real subprocess round-trip. Watch the " }] }, assistantMessageEvent: { type: "text_delta", contentIndex: 0, delta: "…" } } });
			host({ type: "event", event: { type: "tool_execution_start", toolCallId: "tc3", toolName: "ipython", args: { code: "%%bash\nnode test/smoke.mjs" } } });
			host({ type: "event", event: { type: "tool_execution_update", toolCallId: "tc3", toolName: "ipython", args: {}, partialResult: { output: "PASS  process starts\nPASS  get_state succeeds\n" } } });
			host({ type: "changedFiles", files: ["src/rpc-client.ts", "webview/main.ts", "media/main.css"] });
			host({ type: "status", status: { ...baseStatus, streaming: true } });
		}
	</script>
</body>
</html>
